[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-maker"
version = "2.0.0"
description = "中文 LaTeX 报告工程化工具：单章编译 + 整书合并，关键节点质量关卡把关"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "pdf-maker contributors" }]
keywords = ["latex", "xelatex", "chinese", "pdf", "ctex", "book", "report", "skill"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Markup :: LaTeX",
    "Intended Audience :: Developers",
]
# 零第三方依赖：仅使用 Python 标准库与系统 TeX 工具链（xelatex）。
dependencies = []

[project.scripts]
pdfmaker = "pdfmaker.cli:main"

[project.urls]
Homepage = "https://github.com/Suanmd/pdf-maker"
Repository = "https://github.com/Suanmd/pdf-maker"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pdfmaker.templates" = ["*.tex", "*.md"]
